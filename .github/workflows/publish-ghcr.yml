name: Publish GHCR image

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # actions/checkout v5.0.0
      - name: Check out the tagged commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # actions/setup-java v5.0.0
      - name: Set up Temurin JDK 25
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Configure GitHub Maven dependency repository
        shell: bash
        run: |
          set -euo pipefail
          settings_path="${RUNNER_TEMP}/g2rain-cms-settings.xml"
          python3 - "$settings_path" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          ns = 'http://maven.apache.org/SETTINGS/1.0.0'
          ET.register_namespace('', ns)
          def element(parent, name, value=None):
              child = ET.SubElement(parent, f'{{{ns}}}{name}')
              child.text = value
              return child
          root = ET.Element(f'{{{ns}}}settings')
          servers = element(root, 'servers')
          server = element(servers, 'server')
          element(server, 'id', 'g2rain-common')
          element(server, 'username', '${env.GITHUB_ACTOR}')
          element(server, 'password', '${env.GITHUB_TOKEN}')
          profile = element(element(root, 'profiles'), 'profile')
          element(profile, 'id', 'g2rain-packages')
          repository = element(element(profile, 'repositories'), 'repository')
          element(repository, 'id', 'g2rain-common')
          element(repository, 'url', 'https://maven.pkg.github.com/g2rain/g2rain-common')
          element(element(repository, 'releases'), 'enabled', 'true')
          element(element(repository, 'snapshots'), 'enabled', 'false')
          element(element(root, 'activeProfiles'), 'activeProfile', 'g2rain-packages')
          ET.ElementTree(root).write(sys.argv[1], encoding='utf-8', xml_declaration=True)
          PY
          chmod 600 "$settings_path"
          echo "MAVEN_SETTINGS=$settings_path" >> "$GITHUB_ENV"
          echo 'Maven repository g2rain-common: https://maven.pkg.github.com/g2rain/g2rain-common'

      - name: Validate release tag, branch membership, release notes, and version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" || ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable v<major>.<minor>.<patch> tag pushes may publish; got '${tag}'." >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "${tag}^{commit}")"
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "Tag '${tag}' points to ${tag_commit}, which is not in origin/main history." >&2
            exit 1
          fi

          release_note="docs/releases/${tag}.md"
          if ! git cat-file -e "${tag_commit}:${release_note}" 2>/dev/null; then
            echo "Missing ${release_note} at the tagged commit." >&2
            exit 1
          fi
          if [[ -z "$(git show "${tag_commit}:${release_note}" | tr -d '[:space:]')" ]]; then
            echo "${release_note} is empty at the tagged commit." >&2
            exit 1
          fi

          version="$(mvn --settings "$MAVEN_SETTINGS" --batch-mode --no-transfer-progress -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ "v${version}" != "${tag}" ]]; then
            echo "Tag '${tag}' does not match Maven project version '${version}'." >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "commit=${tag_commit}" >> "${GITHUB_OUTPUT}"

      - name: Build and test all modules
        run: mvn --settings "$MAVEN_SETTINGS" --batch-mode --no-transfer-progress -U clean install

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push both immutable image tags with Jib
        working-directory: g2rain-cms-startup
        env:
          IMAGE_NAME: ghcr.io/g2rain/g2rain-cms
          IMAGE_TAG: ${{ steps.release.outputs.version }}
          SHA_TAG: sha-${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          mvn --settings "$MAVEN_SETTINGS" --batch-mode --no-transfer-progress -DskipTests=true compile jib:build \
            "-Djib.to.image=$IMAGE_NAME:$IMAGE_TAG" \
            "-Djib.to.tags=$SHA_TAG"

      - name: Report completed publication
        if: success()
        shell: bash
        run: |
          {
            echo '## GHCR publication complete'
            echo
            echo '- `ghcr.io/g2rain/g2rain-cms:${{ steps.release.outputs.version }}`'
            echo '- `ghcr.io/g2rain/g2rain-cms:sha-${{ steps.release.outputs.commit }}`'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Log out of GHCR
        if: always()
        shell: bash
        run: docker logout ghcr.io

  publish-maven:
    needs: publish
    uses: ./.github/workflows/publish-maven.yml
    permissions:
      contents: read
      packages: write
